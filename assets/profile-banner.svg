<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Ayush Yadav — Developer and Creator</title>
<desc id="desc">A dark navy banner with blue gradient accents and a developer-focused introduction.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080D18"/>
    <stop offset=".58" stop-color="#111C32"/>
    <stop offset="1" stop-color="#123D75"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#60A5FA"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#2563EB" stop-opacity=".34"/>
    <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1200" height="340" rx="24" fill="url(#bg)"/>
<circle cx="1040" cy="80" r="300" fill="url(#glow)"/>
<circle cx="1100" cy="280" r="210" fill="url(#glow)" opacity=".7"/>
<path d="M0 280 C220 230 340 350 590 280 S970 210 1200 270" fill="none" stroke="#60A5FA" stroke-opacity=".16" stroke-width="2"/>
<path d="M0 300 C250 250 400 365 650 300 S980 240 1200 290" fill="none" stroke="#22D3EE" stroke-opacity=".12" stroke-width="2"/>
<g fill="#93C5FD" opacity=".5">
  <circle cx="930" cy="65" r="3"/><circle cx="1000" cy="120" r="2"/><circle cx="1080" cy="45" r="2"/>
  <circle cx="1130" cy="170" r="3"/><circle cx="870" cy="220" r="2"/><circle cx="1040" cy="260" r="2"/>
</g>
<text x="82" y="142" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="1">AYUSH YADAV</text>
<rect x="84" y="168" width="116" height="5" rx="2.5" fill="url(#accent)"/>
<text x="84" y="218" fill="#BFDBFE" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">Developer  ·  Creator  ·  Lifelong Learner</text>
<text x="84" y="260" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Building useful things with code and creativity.</text>
<g transform="translate(1000 168)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
  <path d="M-65 -38 L-105 0 L-65 38"/>
  <path d="M65 -38 L105 0 L65 38"/>
  <path d="M22 -55 L-22 55"/>
